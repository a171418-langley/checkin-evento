<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16697a">
  <title>Check-in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --tinta: #1d2a3a;
      --tinta-suave: #5b6876;
      --papel: #f3f5f2;
      --blanco: #ffffff;
      --linea: #d9dfe4;
      --sello: #16697a;
      --verde: #2f8f5b;
      --verde-claro: #e8f3ec;
      --ambar: #b7791f;
      --ambar-claro: #faf1e1;
      --ladrillo: #b4413c;
      --ladrillo-claro: #f8e9e8;
      --fuente: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--fuente);
      background: var(--papel);
      color: var(--tinta);
      line-height: 1.4;
    }

    .contenedor {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 32px;
    }

    /* ---------- Barra superior ---------- */

    .barra-superior {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .barra-superior h1 {
      margin: 0;
      font-size: 22px;
    }

    #estado {
      font-size: 14px;
      color: var(--tinta-suave);
    }

    .btn-salir {
      padding: 8px 14px;
      border: 1px solid var(--linea);
      border-radius: 10px;
      background: var(--blanco);
      color: var(--tinta);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ---------- Cámara ---------- */

    #reader {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #10202b;
      border-radius: 18px;
      overflow: hidden;
    }

    /* La cámara siempre en cuadro: el video llena el marco y lo que
       sobra se recorta (no se deforma). */
    #reader { position: relative; }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    /* ---------- Resultado (talón del boleto) ---------- */

    .resultado {
      position: relative;
      margin-top: 16px;
      padding: 20px 20px 20px 24px;
      min-height: 112px;
      background: var(--blanco);
      border: 1px solid var(--linea);
      border-left: 8px solid var(--linea);
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .resultado-icono {
      flex: 0 0 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      background: #eef1f3;
      color: var(--tinta-suave);
    }

    .resultado-titulo {
      font-size: 15px;
      font-weight: 700;
      color: var(--tinta-suave);
    }

    .resultado-nombre {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .resultado-detalle {
      font-size: 15px;
      color: var(--tinta-suave);
      margin-top: 2px;
    }

    .resultado.ok { border-left-color: var(--verde); background: var(--verde-claro); }
    .resultado.ok .resultado-icono { background: var(--verde); color: #fff; }
    .resultado.ok .resultado-titulo { color: var(--verde); }

    .resultado.aviso { border-left-color: var(--ambar); background: var(--ambar-claro); }
    .resultado.aviso .resultado-icono { background: var(--ambar); color: #fff; }
    .resultado.aviso .resultado-titulo { color: #8a5a12; }

    .resultado.error { border-left-color: var(--ladrillo); background: var(--ladrillo-claro); }
    .resultado.error .resultado-icono { background: var(--ladrillo); color: #fff; }
    .resultado.error .resultado-titulo { color: var(--ladrillo); }

    .resultado.procesando .resultado-icono { animation: latido 1s ease-in-out infinite; }

    @keyframes latido {
      50% { opacity: .45; }
    }

    /* Un destello breve al llegar un resultado. */
    .resultado.nuevo { animation: aparecer .25s ease-out; }

    @keyframes aparecer {
      from { transform: scale(.97); opacity: .6; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ---------- Acceso ---------- */

    .pantalla-acceso {
      position: fixed;
      inset: 0;
      background: var(--papel);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }

    .acceso {
      width: 100%;
      max-width: 380px;
      background: var(--blanco);
      border: 1px solid var(--linea);
      border-radius: 16px;
      padding: 28px;
    }

    .acceso h2 { margin: 0 0 4px; font-size: 26px; }
    .acceso p { margin: 0 0 20px; color: var(--tinta-suave); }

    .acceso label { display: block; font-weight: 700; margin-bottom: 6px; }

    .acceso input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--linea);
      border-radius: 10px;
      font: inherit;
      font-size: 17px;
      margin-bottom: 14px;
    }

    .acceso button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--sello);
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .acceso button:disabled { background: #9aa7b1; }

    #mensajeAcceso { margin-top: 12px; color: var(--ladrillo); min-height: 24px; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #f2c94c;
      outline-offset: 2px;
    }

    /* ---------- Modo de escaneo (entrada general / talleres) ---------- */

    :root { --modo: var(--sello); --modo-claro: #e6f0f1; }

    body.modo-taller { --modo: #6b4fa0; --modo-claro: #efeaf7; }

    .modos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 0 10px;
    }

    .modos[hidden] { display: none; }

    .modos[hidden] { display: none; }

    .modo-btn {
      flex: 1 1 auto;
      min-width: 40%;
      padding: 10px 14px;
      border: 2px solid var(--linea);
      border-radius: 12px;
      background: var(--blanco);
      color: var(--tinta);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      line-height: 1.2;
    }

    .modo-btn small {
      display: block;
      font-weight: 400;
      font-size: 13px;
      color: var(--tinta-suave);
    }

    .modo-btn[aria-pressed="true"] {
      background: var(--modo);
      border-color: var(--modo);
      color: #fff;
    }

    .modo-btn[aria-pressed="true"] small { color: rgba(255, 255, 255, .85); }

    .modo-actual {
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: var(--modo);
      color: #fff;
      font-weight: 700;
      font-size: 17px;
    }

    .modo-actual span { font-weight: 400; font-size: 14px; opacity: .9; }

    #reader { outline: 5px solid var(--modo); outline-offset: -5px; }

    .aviso-modo {
      display: none;
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--ambar-claro);
      color: #8a5a12;
      font-size: 14px;
    }

    .aviso-modo.visible { display: block; }

    /* ---------- Elegir evento (contraseña maestra) ---------- */

    .lista-eventos { display: grid; gap: 8px; margin-top: 4px; }

    .lista-eventos button {
      background: var(--blanco) !important;
      color: var(--tinta) !important;
      border: 2px solid var(--linea) !important;
      text-align: left;
      font-size: 16px !important;
    }

    .lista-eventos button:hover { border-color: var(--sello) !important; }

    .btn-texto {
      background: none !important;
      color: var(--sello) !important;
      padding: 10px !important;
      font-size: 15px !important;
    }

    .campo-clave { position: relative; }

    .campo-clave input { padding-right: 86px; }

    .btn-ver {
      position: absolute;
      right: 6px;
      top: 6px;
      width: auto !important;
      padding: 8px 10px !important;
      background: none !important;
      color: var(--sello) !important;
      font-size: 14px !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .resultado.procesando .resultado-icono,
      .resultado.nuevo { animation: none; }
    }
  </style>
</head>

<body>

  <!-- ACCESO -->
  <div id="pantallaAcceso" class="pantalla-acceso">
    <div class="acceso">

      <div id="pasoClave">
        <h2>Check-in</h2>
        <p>Escribe el código de check-in de tu evento.</p>

        <label for="claveCheckinInput">Código de acceso</label>
        <div class="campo-clave">
          <input type="password" id="claveCheckinInput" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" placeholder="Ej. K7P2-QX9M">
          <button type="button" id="btnVer" class="btn-ver" aria-pressed="false">Mostrar</button>
        </div>

        <button id="btnAcceder">Entrar</button>
      </div>

      <div id="pasoEvento" hidden>
        <h2>Elige el evento</h2>
        <p>Eventos con check-in abierto ahora.</p>
        <div id="listaEventos" class="lista-eventos"></div>
        <button type="button" id="btnVolver" class="btn-texto">Volver</button>
      </div>

      <div id="mensajeAcceso" role="alert"></div>
    </div>
  </div>


  <div class="contenedor">

    <div class="barra-superior">
      <div>
        <h1 id="nombreEvento">Check-in</h1>
        <div id="estado">Esperando acceso…</div>
      </div>
      <button id="btnSalir" class="btn-salir">Salir</button>
    </div>

    <div id="modos" class="modos" role="group" aria-label="Dónde estás escaneando"></div>

    <div id="avisoModo" class="aviso-modo" role="status"></div>

    <div class="modo-actual" id="modoActual">Entrada general</div>

    <div id="reader"></div>

    <div id="resultado" class="resultado" role="status" aria-live="assertive">
      <div class="resultado-icono" id="resIcono" aria-hidden="true">⌁</div>
      <div>
        <div class="resultado-titulo" id="resTitulo">Listo para escanear</div>
        <div class="resultado-nombre" id="resNombre"></div>
        <div class="resultado-detalle" id="resDetalle">Apunta la cámara al código QR de la invitación.</div>
      </div>
    </div>

  </div>


<script>

  /*
   * ==========================================
   * CONFIGURACIÓN
   * ==========================================
   * Si cambias de implementación en Apps Script,
   * esta es la única línea que debes actualizar.
   */
  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbzq5DsVjAo3iuENvsCpI7KpaBi7W1PoXEvk6PePB0m367auHQzxCiLaVoUUhlBNPu6L/exec";

  // Espera máxima por cada respuesta del servidor.
  const TIMEOUT_MS = 15000;

  // Pausa tras mostrar un resultado, antes de aceptar otro QR.
  const PAUSA_TRAS_RESULTADO_MS = 1200;

  // Si el mismo QR sigue frente a la cámara, se ignora este tiempo.
  const IGNORAR_MISMO_CODIGO_MS = 8000;

  const MENSAJE_NO_AUTORIZADO = "Acceso no autorizado.";

  // Lector de QR: primero el archivo local del repositorio y,
  // si no está, una copia fija desde unpkg.
  const FUENTES_LECTOR = [
    "html5-qrcode.min.js",
    "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ];

  const $ = id => document.getElementById(id);

  // Cada cuánto se revisan los talleres activos (aparecen 10 min antes).
  const REFRESCO_MODOS_MS = 60000;

  let claveCheckin = leerSesion("claveCheckin");
  let idEventoElegido = leerSesion("idEventoCheckin");   // solo con la contraseña maestra
  let modos = [];
  let modoActual = "general";
  let intervaloModos = null;
  let procesando = false;
  let ultimoCodigo = "";
  let ultimoMomento = 0;
  let lector = null;
  let audio = null;


  function leerSesion(clave) {
    try { return sessionStorage.getItem(clave) || ""; } catch (e) { return ""; }
  }

  function guardarSesion(clave, valor) {
    try {
      if (valor) sessionStorage.setItem(clave, valor);
      else sessionStorage.removeItem(clave);
    } catch (e) {}
  }


  /*
   * ==========================================
   * COMUNICACIÓN CON APPS SCRIPT (JSONP)
   * ==========================================
   */
  function llamarBackend(parametros, callback) {

    const nombreCallback =
      "cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);

    const script = document.createElement("script");

    let terminado = false;
    let temporizador = null;

    function terminar(datos) {

      if (terminado) return;

      terminado = true;

      clearTimeout(temporizador);

      // Si la respuesta llega tarde, que no cause errores.
      window[nombreCallback] = function () {};

      script.remove();

      callback(datos);
    }

    window[nombreCallback] = terminar;

    temporizador = setTimeout(function () {
      terminar({
        ok: false,
        timeout: true,
        mensaje: "El servidor tardó demasiado en responder."
      });
    }, TIMEOUT_MS);

    script.onerror = function () {
      terminar({
        ok: false,
        mensaje: "No se pudo comunicar con el servidor. Revisa la conexión a internet."
      });
    };

    const query = new URLSearchParams(parametros);

    query.append("callback", nombreCallback);

    script.src = URL_APPS_SCRIPT + "?" + query.toString();

    document.body.appendChild(script);
  }


  /*
   * ==========================================
   * SONIDO Y VIBRACIÓN
   * ==========================================
   * Para que el personal sepa el resultado sin mirar la pantalla.
   */
  function sonar(tipo) {

    try {

      if (navigator.vibrate) {
        navigator.vibrate(tipo === "ok" ? 80 : [120, 80, 120]);
      }

      audio = audio || new (window.AudioContext || window.webkitAudioContext)();

      const notas = tipo === "ok" ? [880, 1320] : tipo === "aviso" ? [660] : [300, 220];

      notas.forEach(function (frecuencia, i) {

        const osc = audio.createOscillator();
        const vol = audio.createGain();
        const inicio = audio.currentTime + i * 0.13;

        osc.frequency.value = frecuencia;
        osc.type = "sine";
        vol.gain.setValueAtTime(0.18, inicio);
        vol.gain.exponentialRampToValueAtTime(0.001, inicio + 0.12);

        osc.connect(vol);
        vol.connect(audio.destination);
        osc.start(inicio);
        osc.stop(inicio + 0.13);
      });

    } catch (error) {
      // Sin sonido no pasa nada.
    }
  }


  /*
   * ==========================================
   * PANTALLA DE RESULTADO
   * ==========================================
   */
  const ICONOS = { ok: "✓", aviso: "!", error: "✕", procesando: "…", "": "⌁" };

  function mostrar(clase, titulo, nombre, detalle) {

    const caja = $("resultado");

    caja.className = "resultado " + (clase || "");

    // textContent: el nombre del invitado nunca se interpreta como HTML.
    $("resIcono").textContent = ICONOS[clase || ""] || "⌁";
    $("resTitulo").textContent = titulo || "";
    $("resNombre").textContent = nombre || "";
    $("resDetalle").textContent = detalle || "";

    if (clase && clase !== "procesando") {
      void caja.offsetWidth;   // reinicia la animación
      caja.classList.add("nuevo");
    }
  }


  function mostrarListo() {
    mostrar("", "Listo para escanear", "", "Apunta la cámara al código QR de la invitación.");
  }


  /*
   * ==========================================
   * ACCESO
   * ==========================================
   */
  function mostrarLogin(mensaje) {

    $("pasoClave").hidden = false;
    $("pasoEvento").hidden = true;
    $("claveCheckinInput").value = "";
    $("mensajeAcceso").textContent = mensaje || "";
    $("btnAcceder").disabled = false;
    $("btnAcceder").textContent = "Entrar";
    $("pantallaAcceso").style.display = "flex";
    $("claveCheckinInput").focus();
  }


  function consultarEstado(clave, idEvento, callback) {

    const parametros = { accion: "estadoCheckin", clave: clave };

    if (idEvento) parametros.idEvento = idEvento;

    llamarBackend(parametros, callback);
  }


  function iniciarSesion() {

    const input = $("claveCheckinInput");
    const boton = $("btnAcceder");
    const mensaje = $("mensajeAcceso");

    const clave = input.value.trim();

    if (!clave) {
      mensaje.textContent = "Escribe el código de acceso.";
      return;
    }

    boton.disabled = true;
    boton.textContent = "Entrando…";
    mensaje.textContent = "";

    // Se prepara el sonido aquí: los navegadores lo permiten solo
    // después de que la persona toca la pantalla.
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {}

    consultarEstado(clave, "", function (datos) {

      boton.disabled = false;
      boton.textContent = "Entrar";

      if (!datos || datos.ok !== true) {
        mensaje.textContent = (datos && datos.mensaje) || "No se pudo verificar el acceso.";
        input.value = "";
        input.focus();
        return;
      }

      claveCheckin = clave;

      // Contraseña maestra: primero se elige el evento.
      if (datos.maestro && !datos.evento) {
        mostrarEventosAbiertos(datos.eventos || []);
        return;
      }

      guardarSesion("claveCheckin", clave);
      guardarSesion("idEventoCheckin", "");
      idEventoElegido = "";

      entrar(datos);
    });
  }


  function mostrarEventosAbiertos(eventos) {

    const lista = $("listaEventos");

    lista.replaceChildren();

    $("pasoClave").hidden = true;
    $("pasoEvento").hidden = false;
    $("mensajeAcceso").textContent = "";

    if (!eventos.length) {
      const vacio = document.createElement("p");
      vacio.textContent = "No hay ningún evento con check-in abierto en este momento.";
      lista.appendChild(vacio);
      return;
    }

    eventos.forEach(function (evento) {

      const boton = document.createElement("button");
      boton.type = "button";
      boton.textContent = evento.nombre;

      boton.addEventListener("click", function () {

        boton.disabled = true;

        consultarEstado(claveCheckin, evento.id, function (datos) {

          boton.disabled = false;

          if (!datos || datos.ok !== true) {
            $("mensajeAcceso").textContent = (datos && datos.mensaje) || "No se pudo abrir el evento.";
            return;
          }

          idEventoElegido = evento.id;
          guardarSesion("claveCheckin", claveCheckin);
          guardarSesion("idEventoCheckin", evento.id);

          entrar(datos);
        });
      });

      lista.appendChild(boton);
    });
  }


  function entrar(datos) {

    $("pantallaAcceso").style.display = "none";
    $("nombreEvento").textContent = datos.evento.nombre;
    document.title = "Check-in · " + datos.evento.nombre;

    modoActual = "general";
    actualizarModos(datos.modos || []);

    mostrarListo();
    iniciarCamara();

    if (!intervaloModos) {
      intervaloModos = setInterval(refrescarModos, REFRESCO_MODOS_MS);
    }
  }


  async function salir(mensaje) {

    claveCheckin = "";
    idEventoElegido = "";
    guardarSesion("claveCheckin", "");
    guardarSesion("idEventoCheckin", "");

    if (intervaloModos) {
      clearInterval(intervaloModos);
      intervaloModos = null;
    }

    await detenerCamara();

    $("estado").textContent = "Esperando acceso…";
    $("nombreEvento").textContent = "Check-in";
    $("modos").replaceChildren();
    modoActual = "general";
    pintarModo();

    mostrarListo();
    mostrarLogin(mensaje);
  }


  /*
   * ==========================================
   * MODOS: ENTRADA GENERAL Y TALLERES
   * ==========================================
   */
  function modoPorId(id) {
    return modos.find(function (m) { return m.id === id; });
  }


  function actualizarModos(nuevos) {

    modos = nuevos.length ? nuevos : [{ id: "general", nombre: "Entrada general" }];

    // Si el taller elegido ya terminó, se regresa a la entrada general.
    if (!modoPorId(modoActual)) {

      const anterior = modoActual;

      modoActual = "general";

      if (anterior !== "general") {
        avisarModo("El taller terminó. Volviste a la entrada general.");
        mostrarListo();
        sonar("aviso");
      }
    }

    const caja = $("modos");

    caja.replaceChildren();

    // Con un solo modo (sin talleres activos) no hace falta elegir.
    caja.hidden = modos.length < 2;

    modos.forEach(function (modo) {

      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = "modo-btn";
      boton.setAttribute("aria-pressed", modo.id === modoActual ? "true" : "false");
      boton.textContent = modo.nombre;

      if (modo.horario) {
        const detalle = document.createElement("small");
        detalle.textContent = "Taller · " + modo.horario;
        boton.appendChild(detalle);
      }

      boton.addEventListener("click", function () { elegirModo(modo.id); });

      caja.appendChild(boton);
    });

    pintarModo();
  }


  function elegirModo(id) {

    if (id === modoActual) return;

    modoActual = id;
    avisarModo("");

    actualizarModos(modos);
    mostrarListo();

    ultimoCodigo = "";
  }


  function pintarModo() {

    const modo = modoPorId(modoActual) || { id: "general", nombre: "Entrada general" };
    const esTaller = modo.id !== "general";

    document.body.classList.toggle("modo-taller", esTaller);

    const barra = $("modoActual");

    barra.textContent = esTaller ? "Taller: " + modo.nombre : "Entrada general";

    if (esTaller && modo.horario) {
      const horario = document.createElement("span");
      horario.textContent = " · " + modo.horario;
      barra.appendChild(horario);
    }
  }


  function avisarModo(texto) {

    const caja = $("avisoModo");

    caja.textContent = texto;
    caja.classList.toggle("visible", !!texto);
  }


  function refrescarModos() {

    if (!claveCheckin) return;

    consultarEstado(claveCheckin, idEventoElegido, function (datos) {

      if (!datos || datos.timeout) return;   // Sin red: se intenta en el siguiente minuto.

      if (datos.ok !== true) {
        salir(datos.mensaje || "El check-in de este evento ya no está disponible.");
        return;
      }

      if (datos.evento) actualizarModos(datos.modos || []);
    });
  }


  /*
   * ==========================================
   * CÁMARA Y LECTURA DE QR
   * ==========================================
   */
  function cargarLector() {

    return new Promise(function (resolve, reject) {

      if (window.Html5Qrcode) {
        resolve();
        return;
      }

      (function intentar(i) {

        if (i >= FUENTES_LECTOR.length) {
          reject(new Error("No se pudo cargar el lector de QR."));
          return;
        }

        const script = document.createElement("script");

        script.src = FUENTES_LECTOR[i];

        script.onload = function () { resolve(); };

        script.onerror = function () {
          script.remove();
          intentar(i + 1);
        };

        document.head.appendChild(script);

      })(0);
    });
  }


  async function iniciarCamara() {

    $("estado").textContent = "Iniciando cámara…";

    try {

      await cargarLector();

      lector = new Html5Qrcode("reader");

      await lector.start(
        { facingMode: "environment" },
        {
          fps: 10,
          // Video cuadrado y zona de lectura cuadrada.
          aspectRatio: 1.0,
          qrbox: function (ancho, alto) {
            const lado = Math.floor(Math.min(ancho, alto) * 0.7);
            return { width: lado, height: lado };
          }
        },
        qrDetectado,
        function () {
          // No mostramos errores de lectura continuamente.
        }
      );

      $("estado").textContent = "Cámara lista";

    } catch (error) {

      console.error(error);

      lector = null;

      $("estado").textContent = "La cámara no está disponible";

      mostrar(
        "error",
        "No se pudo iniciar la cámara",
        "",
        error && error.message === "No se pudo cargar el lector de QR."
          ? "No se pudo cargar el lector. Revisa la conexión a internet y recarga la página."
          : "Revisa que el navegador tenga permiso para usar la cámara y recarga la página."
      );
    }
  }


  async function detenerCamara() {

    if (!lector) return;

    try {
      await lector.stop();
    } catch (error) {
      // Ya estaba detenida.
    }

    lector = null;
  }


  function qrDetectado(texto) {

    if (procesando) return;

    const codigo = String(texto || "").trim();

    if (!codigo) return;

    const ahora = Date.now();

    // El mismo QR frente a la cámara: se ignora un rato.
    if (codigo === ultimoCodigo && ahora - ultimoMomento < IGNORAR_MISMO_CODIGO_MS) {
      return;
    }

    procesando = true;
    ultimoCodigo = codigo;
    ultimoMomento = ahora;

    mostrar("procesando", "Verificando…", "", "Un momento.");

    const parametros = {
      accion: "checkinEvento",
      codigoQR: codigo,
      clave: claveCheckin,
      modo: modoActual
    };

    if (idEventoElegido) parametros.idEvento = idEventoElegido;

    llamarBackend(
      parametros,
      function (datos) {

        ultimoMomento = Date.now();

        if (datos && datos.ok === true && datos.tipo === "Taller") {

          mostrar("ok", "Asistencia registrada", datos.nombre || "", "Taller: " + (datos.taller || ""));
          sonar("ok");

        } else if (datos && datos.ok === true) {

          const entrada = datos.tipo !== "Salida";

          mostrar(
            "ok",
            entrada ? "Bienvenido(a)" : "Salida registrada",
            datos.nombre || "",
            datos.nombre ? (entrada ? "Entrada registrada." : "Hasta pronto.") : datos.mensaje
          );

          sonar("ok");

        } else if (datos && datos.repetido) {

          mostrar("aviso", "Ya registrado", datos.nombre || "", datos.mensaje);
          sonar("aviso");

        } else if (datos && datos.tallerCerrado) {

          mostrar("aviso", "Taller cerrado", "", datos.mensaje);
          sonar("aviso");
          refrescarModos();

        } else if (datos && datos.cerrado) {

          procesando = false;
          salir(datos.mensaje);
          return;

        } else if (datos && datos.mensaje === "Código de acceso incorrecto.") {

          procesando = false;
          salir("La sesión terminó. Entra de nuevo.");
          return;

        } else if (datos && datos.timeout) {

          // El servidor pudo haber registrado el escaneo:
          // se pide verificar antes de reintentar.
          mostrar(
            "aviso",
            "Sin respuesta del servidor",
            "",
            "Puede que sí se haya registrado. Espera unos segundos y vuelve a escanear: " +
            "si ya quedó, dirá \"Ya registrado\"."
          );
          sonar("aviso");

        } else {

          mostrar(
            "error",
            datos && datos.sinEntrada ? "Falta la entrada general" : "No se puede registrar",
            (datos && datos.nombre) || "",
            (datos && datos.mensaje) || "Ocurrió un error inesperado."
          );
          sonar("error");
        }

        setTimeout(function () {
          procesando = false;
        }, PAUSA_TRAS_RESULTADO_MS);
      }
    );
  }


  /*
   * ==========================================
   * INICIO
   * ==========================================
   */
  $("btnAcceder").addEventListener("click", iniciarSesion);

  $("claveCheckinInput").addEventListener("keydown", function (evento) {
    if (evento.key === "Enter") iniciarSesion();
  });

  $("btnSalir").addEventListener("click", function () {
    salir("");
  });

  $("btnVolver").addEventListener("click", function () { mostrarLogin(""); });

  $("btnVer").addEventListener("click", function () {
    const input = $("claveCheckinInput");
    const visible = input.type === "password";
    input.type = visible ? "text" : "password";
    this.textContent = visible ? "Ocultar" : "Mostrar";
    this.setAttribute("aria-pressed", visible ? "true" : "false");
    input.focus();
  });

  // Si ya había una sesión en esta pestaña, se verifica en silencio.
  if (claveCheckin) {

    $("btnAcceder").disabled = true;
    $("btnAcceder").textContent = "Entrando…";

    consultarEstado(claveCheckin, idEventoElegido, function (datos) {

      if (datos && datos.ok === true && datos.evento) {
        entrar(datos);
        return;
      }

      claveCheckin = "";
      idEventoElegido = "";
      guardarSesion("claveCheckin", "");
      guardarSesion("idEventoCheckin", "");

      mostrarLogin((datos && datos.mensaje) || "");
    });

  } else {

    $("claveCheckinInput").focus();
  }

</script>

</body>
</html>
