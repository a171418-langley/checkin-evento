<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administración de eventos</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .contenedor {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .tarjeta h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #estado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .info {
      line-height: 1.7;
    }

    .sin-evento {
      color: #555;
    }
    
    .pantalla-acceso {
  position: fixed;
  inset: 0;
  background: #f4f6f8;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.login {
  width: 90%;
  max-width: 400px;
  background: white;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

.login h2 {
  margin-top: 0;
  text-align: center;
  margin-bottom: 25px;
}

.login input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 15px;
}

.login button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.login button:disabled {
  background: #999;
}

#mensajeAcceso {
  margin-top: 15px;
  text-align: center;
  color: #721c24;
}
    
  </style>
</head>

  <div id="pantallaAcceso" class="pantalla-acceso">
  <div class="login">
    <h2>Administración de eventos</h2>

    <input
      type="password"
      id="claveAdminInput"
      placeholder="Contraseña"
      autocomplete="off"
    >

    <button id="btnAcceder" onclick="iniciarSesion()">
      Acceder
    </button>

    <div id="mensajeAcceso"></div>
  </div>
</div>

<body>

  <div class="contenedor">

    <h1>Administración de eventos</h1>

    <!-- EVENTO ACTUAL -->
    <div class="tarjeta">

      <h2>Evento actual</h2>

      <div id="eventoActual" class="info">
        Cargando información...
      </div>

    </div>


    <!-- CREAR EVENTO -->
    <div class="tarjeta">

      <h2>Crear nuevo evento</h2>

      <div class="campo">
        <label for="nombreEvento">
          Nombre del evento
        </label>

        <input
          type="text"
          id="nombreEvento"
          placeholder="Ej. Evento de graduación"
        >
      </div>


      <div class="campo">
        <label for="fechaInicio">
          Fecha de inicio
        </label>

        <input
          type="date"
          id="fechaInicio"
        >
      </div>


      <div class="campo">
        <label for="fechaFin">
          Fecha de finalización
        </label>

        <input
          type="date"
          id="fechaFin"
        >
      </div>


      <div class="campo">
        <label for="horaInicio">
          Hora de inicio
        </label>

        <input
          type="time"
          id="horaInicio"
        >
      </div>


      <div class="campo">
        <label for="horaFin">
          Hora de finalización
        </label>

        <input
          type="time"
          id="horaFin"
        >
      </div>

      <div class="campo">
  <label for="archivoInvitados">
    Lista de invitados
  </label>

  <input
    type="file"
    id="archivoInvitados"
    accept=".xlsx,.xls,.csv"
  >

  <small>
    El archivo debe contener las columnas Nombre y Correo.
  </small>
</div>
      
      <button
        id="btnCrear"
        onclick="crearEvento()"
      >
        Crear evento
      </button>

      <div id="estado"></div>

    </div>

  </div>


<script>

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbzq5DsVjAo3iuENvsCpI7KpaBi7W1PoXEvk6PePB0m367auHQzxCiLaVoUUhlBNPu6L/exec";
  let claveAdmin = "";

  function iniciarSesion() {

  const input = document.getElementById("claveAdminInput");
  const boton = document.getElementById("btnAcceder");
  const mensaje = document.getElementById("mensajeAcceso");

  const clave = input.value.trim();

  if (!clave) {
    mensaje.textContent = "Debes ingresar una contraseña.";
    return;
  }

  boton.disabled = true;
  boton.textContent = "Verificando...";
  mensaje.textContent = "";

  claveAdmin = clave;

  // Hacer una petición que requiera autenticación
  llamarBackend(
    { accion: "obtenerEventoActualAdmin" },
    function(datos) {

      if (
        datos &&
        datos.ok === false &&
        datos.mensaje === "Acceso no autorizado."
      ) {

        claveAdmin = "";

        boton.disabled = false;
        boton.textContent = "Acceder";

        mensaje.textContent = "Contraseña incorrecta.";

        input.value = "";
        input.focus();

        return;
      }

      // Acceso correcto
      document.getElementById("pantallaAcceso").style.display = "none";

      boton.disabled = false;
      boton.textContent = "Acceder";

      cargarEventoActual();
    }
  );
}

  /*
   * Comunicación con Apps Script mediante JSONP
   */
  function llamarBackend(parametros, callback) {

  const nombreCallback = "respuesta_" + Date.now();

  window[nombreCallback] = function(datos) {
    callback(datos);
    delete window[nombreCallback];
    script.remove();
  };

  const query = new URLSearchParams();

  for (const clave in parametros) {
    query.append(clave, parametros[clave]);
  }

  // Agregar la clave de administrador
  query.append("clave", claveAdmin);

  query.append("callback", nombreCallback);

  const script = document.createElement("script");

  script.src =
    URL_APPS_SCRIPT + "?" + query.toString();

  script.onerror = function() {

    callback({
      ok: false,
      mensaje: "No se pudo comunicar con el servidor."
    });

    delete window[nombreCallback];
    script.remove();
  };

  document.body.appendChild(script);
}


  /*
   * Mostrar estado
   */
  function mostrarEstado(mensaje, error = false) {

    const elemento =
      document.getElementById("estado");

    elemento.style.display = "block";

    elemento.textContent = mensaje;

    elemento.style.background =
      error ? "#f8d7da" : "#d4edda";

    elemento.style.color =
      error ? "#721c24" : "#155724";
  }


  /*
   * Obtener evento actual
   */
  function cargarEventoActual() {

    llamarBackend(
      {
        accion: "obtenerEventoActualAdmin"
      },

      function(datos) {

        const contenedor =
          document.getElementById("eventoActual");


        if (!datos.ok) {

          contenedor.innerHTML =
            "<span class='sin-evento'>" +
            "Error al consultar el evento." +
            "</span>";

          return;
        }


        if (!datos.evento) {

          contenedor.innerHTML =
            "<span class='sin-evento'>" +
            "No hay ningún evento vigente." +
            "</span>";

          return;
        }


        const evento = datos.evento;


        contenedor.innerHTML =
  "<strong>" +
  evento.nombre +
  "</strong><br><br>" +

  "Finaliza el: " +
  evento.fechaFin +
  "<br>" +

  "Hora de finalización: " +
  evento.horaFin;
      }
    );
  }


  /*
   * Crear evento
   */
  async function crearEvento() {

  const nombre =
    document.getElementById("nombreEvento")
      .value.trim();

  const fechaInicio =
    document.getElementById("fechaInicio")
      .value;

  const fechaFin =
    document.getElementById("fechaFin")
      .value;

  const horaInicio =
    document.getElementById("horaInicio")
      .value;

  const horaFin =
    document.getElementById("horaFin")
      .value;

  const archivo =
    document.getElementById("archivoInvitados")
      .files[0];


  if (
    !nombre ||
    !fechaInicio ||
    !fechaFin ||
    !horaInicio ||
    !horaFin
  ) {

    mostrarEstado(
      "Completa todos los campos.",
      true
    );

    return;
  }


  if (!archivo) {

    mostrarEstado(
      "Selecciona el archivo de invitados.",
      true
    );

    return;
  }


  const confirmar =
    confirm(
      "¿Estás seguro/a de que deseas crear este evento?\n\n" +
      "El evento y la lista de invitados serán registrados."
    );

  if (!confirmar) {
    return;
  }


  const btn =
    document.getElementById("btnCrear");

  btn.disabled = true;

  btn.textContent =
    "Creando evento...";


  try {

    /*
     * ==========================================
     * 1. LEER ARCHIVO
     * ==========================================
     */

    const invitados =
      await leerArchivoInvitados(archivo);


    /*
     * ==========================================
     * 2. VALIDAR LISTA
     * ==========================================
     */

    if (invitados.length === 0) {

      throw new Error(
        "El archivo no contiene invitados válidos."
      );

    }


    mostrarEstado(
      "Creando evento y registrando invitados..."
    );


    /*
     * ==========================================
     * 3. CREAR EVENTO
     * ==========================================
     */

    llamarBackend(
      {
        accion: "crearEvento",
        nombre: nombre,
        fechaInicio: fechaInicio,
        fechaFin: fechaFin,
        horaInicio: horaInicio,
        horaFin: horaFin
      },

      async function(datos) {

        if (!datos.ok) {

          btn.disabled = false;

          btn.textContent =
            "Crear evento";

          mostrarEstado(
            datos.mensaje,
            true
          );

          return;
        }


        const idEvento =
          datos.id;


        /*
         * ==========================================
         * 4. CARGAR INVITADOS POR LOTES
         * ==========================================
         */

        try {

          await cargarInvitadosPorLotes(
            idEvento,
            invitados
          );


          /*
           * ======================================
           * 5. TERMINADO
           * ======================================
           */

        const cierre = await llamarBackendPromesa({
       accion: "finalizarCarga",
       idEvento: idEvento,
       total: invitados.length
     });
     if (!cierre.ok) throw new Error(cierre.mensaje);

     mostrarEstado(
  "Evento creado y " +
  invitados.length +
  " invitados registrados. " +
  "Los QR se generan en segundo plano."
);


          /*
           * Limpiar formulario
           */

          document.getElementById(
            "nombreEvento"
          ).value = "";

          document.getElementById(
            "fechaInicio"
          ).value = "";

          document.getElementById(
            "fechaFin"
          ).value = "";

          document.getElementById(
            "horaInicio"
          ).value = "";

          document.getElementById(
            "horaFin"
          ).value = "";

          document.getElementById(
            "archivoInvitados"
          ).value = "";


          btn.disabled = false;

          btn.textContent =
            "Crear evento";


          cargarEventoActual();


        } catch (error) {

          btn.disabled = false;

          btn.textContent =
            "Crear evento";

          mostrarEstado(
            "El evento fue creado, pero hubo un problema al cargar la lista: " +
            error.message,
            true
          );

        }

      }
    );

  } catch (error) {

    btn.disabled = false;

    btn.textContent =
      "Crear evento";

    mostrarEstado(
      error.message,
      true
    );
  }
}

  async function leerArchivoInvitados(archivo) {

  const datos =
    await archivo.arrayBuffer();

  const libro =
    XLSX.read(
      datos,
      {
        type: "array"
      }
    );

  const nombreHoja =
    libro.SheetNames[0];

  const hoja =
    libro.Sheets[nombreHoja];

  const filas =
    XLSX.utils.sheet_to_json(
      hoja,
      {
        defval: ""
      }
    );


  if (filas.length === 0) {

    throw new Error(
      "El archivo está vacío."
    );

  }


  /*
   * Buscar columnas ignorando mayúsculas,
   * minúsculas y espacios.
   */

  const primeraFila =
    filas[0];

  const columnas =
    Object.keys(primeraFila);


  const columnaNombre =
    columnas.find(
      columna =>
        normalizarColumna(columna) === "nombre"
    );

  const columnaCorreo =
    columnas.find(
      columna =>
        normalizarColumna(columna) === "correo"
    );


  if (!columnaNombre || !columnaCorreo) {

    throw new Error(
      "El archivo debe contener las columnas Nombre y Correo."
    );

  }


  const resultado = [];

  const correosVistos =
    new Set();


  filas.forEach((fila, indice) => {

    const nombre =
      String(
        fila[columnaNombre] || ""
      ).trim();

    const correo =
      String(
        fila[columnaCorreo] || ""
      )
      .trim()
      .toLowerCase();


    /*
     * Ignorar filas completamente vacías
     */

    if (!nombre && !correo) {
      return;
    }


    if (!nombre || !correo) {

      throw new Error(
        "La fila " +
        (indice + 2) +
        " tiene Nombre o Correo vacío."
      );

    }


    if (!correoValido(correo)) {

      throw new Error(
        "El correo de la fila " +
        (indice + 2) +
        " no tiene un formato válido: " +
        correo
      );

    }


    /*if (correosVistos.has(correo)) {

      throw new Error(
        "El correo aparece duplicado en el archivo: " +
        correo
      );

    }


    correosVistos.add(correo);*/


    resultado.push({
      nombre: nombre,
      correo: correo
    });

  });


  return resultado;
}


function normalizarColumna(valor) {

  return String(valor || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}


function correoValido(correo) {

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(correo);

}


async function cargarInvitadosPorLotes(
  idEvento,
  invitados
) {

  /*
   * 50 invitados por petición.
   *
   * Esto evita enviar 800 registros
   * en una sola URL.
   */

  const TAMANO_LOTE = 25;


  for (
    let inicio = 0;
    inicio < invitados.length;
    inicio += TAMANO_LOTE
  ) {

    const lote =
      invitados.slice(
        inicio,
        inicio + TAMANO_LOTE
      );


    const resultado =
      await llamarBackendPromesa({
        accion: "cargarInvitados",
        idEvento: idEvento,
        datos: JSON.stringify(lote)
      });


    if (!resultado.ok) {

      throw new Error(
        resultado.mensaje ||
        "No se pudo cargar un lote de invitados."
      );

    }
  }
}


function llamarBackendPromesa(parametros) {

  return new Promise(
    function(resolve) {

      llamarBackend(
        parametros,
        function(datos) {
          resolve(datos);
        }
      );

    }
  );
}
  
  /*
   * Cargar información al abrir la página
   */
 

</script>

</body>
</html>
